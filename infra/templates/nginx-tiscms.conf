# TEMPLATE ONLY. Not installed or enabled.
# Include at nginx's http context. Replace example.invalid with the approved domain.
# A valid certificate AND a real root-only proxy-secret include are required.
# Do not run nginx -T or print that private include: it contains the real token.

map $request_method $tis_write_ip {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $tis_write_ip zone=tis_write:10m rate=2r/s;
log_format tis_minimal '$remote_addr [$time_local] "$request_method $uri" '
                       '$status $body_bytes_sent rt=$request_time '
                       'urt=$upstream_response_time';

upstream tis_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.invalid;
    return 308 https://example.invalid$request_uri;
}

# Requires nginx >= 1.19.4. Unknown TLS SNI is refused without forwarding.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.invalid;
    ssl_certificate /etc/letsencrypt/live/example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # Reject an unexpected HTTP Host even when TLS SNI was legitimate.
    if ($host != example.invalid) { return 444; }
    access_log /var/log/nginx/tiscms-access.log tis_minimal;
    error_log /var/log/nginx/tiscms-error.log warn;
    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_req_status 429;

    location / {
        # Tune burst/rate with private acceptance tests. App DB limits remain active.
        limit_req zone=tis_write burst=10 nodelay;
        proxy_pass http://tis_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host example.invalid;
        proxy_set_header X-Forwarded-Host example.invalid;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        # NEVER use $proxy_add_x_forwarded_for or a client-supplied header here.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        # Must set X-TIS-Proxy-Token to the same real secret as the app.
        # There is intentionally no fallback/placeholder token directive.
        include /etc/tiscms/proxy-secret-header.conf;
        proxy_hide_header X-TIS-Proxy-Token;
        proxy_cache off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
