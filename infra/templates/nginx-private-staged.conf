# FULL nginx config for a NEW private VPS only, not an http-context include.
# No certificate, credential, application forwarding or public listener.
# This verifies nginx syntax/listening only, NOT the production proxy contract.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 512;
}

http {
    server_tokens off;
    log_format tis_private '$remote_addr [$time_local] "$request_method $uri" $status';
    access_log /var/log/nginx/tiscms-private-access.log tis_private;

    server {
        listen 127.0.0.1:8080 default_server;
        server_name 127.0.0.1;
        if ($host != 127.0.0.1) { return 444; }
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 503 "TIS private provisioning: application not enabled.\n";
    }
}
